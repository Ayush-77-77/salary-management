databases:
  - name: salary-management-db
    databaseName: salary_management
    user: salary_management
    plan: free

services:
  - type: web
    name: salary-management-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /up
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salary-management-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: HTTP_PORT
        value: 10000
      - key: FRONTEND_ORIGINS
        value: https://salary-management-web.onrender.com

  - type: web
    name: salary-management-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://salary-management-api.onrender.com
      - key: NODE_VERSION
        value: "26"
